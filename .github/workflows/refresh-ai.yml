name: Refresh AI analysis
on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/public/data/majalengka.json'
      - 'apps/web/public/data/projections.json'
      - 'apps/web/public/data/agronomy.json'
      - 'apps/web/public/data/environment.json'
      - 'apps/web/scripts/analysis-contract.mjs'
      - 'apps/web/scripts/gemini-analysis.mjs'
      - 'apps/web/scripts/generate-ai-summaries.mjs'
      - 'apps/web/src/data/planning-policy.mjs'
      - '.github/workflows/refresh-ai.yml'
permissions:
  contents: read
concurrency:
  group: refresh-ai-main
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run data:verify
      - name: Generate only missing or changed analyses
        run: npm run data:ai -- --check-connection
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      - run: npm run data:verify:ai
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Publish the validated snapshot
        run: node scripts/publish-analysis.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
