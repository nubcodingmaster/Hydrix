name: Refresh AI analysis
on:
  workflow_dispatch:
    inputs:
      allow_full_refresh:
        description: Allow regeneration of up to 106 locations (uses Gemini quota)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'apps/web/public/data/majalengka.json'
      - 'apps/web/public/data/projections.json'
      - 'apps/web/public/data/agronomy.json'
      - 'apps/web/public/data/environment.json'
      - 'apps/web/scripts/analysis-contract.mjs'
      - 'apps/web/scripts/gemini-analysis.mjs'
      - 'apps/web/scripts/generate-ai-summaries.mjs'
      - 'apps/web/src/data/planning-policy.mjs'
      - '.github/workflows/refresh-ai.yml'
permissions:
  contents: read
concurrency:
  group: refresh-ai-main
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run data:verify
      - name: Generate only missing or changed analyses
        run: npm run data:ai -- --check-connection
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AI_MAX_NEW_LOCATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_full_refresh && '106' || '8' }}
      - run: npm run data:verify:ai
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Publish the validated snapshot
        run: node scripts/publish-analysis.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
